name: CI

on:
  push:
    branches: [master, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22', '24']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Build module
        run: npm run build:module

      - name: Build web
        run: npm run build:web

      - name: Test
        run: npm test

      - name: Check build output
        run: |
          for file in \
            dist/module/index.mjs \
            dist/module/index.cjs \
            dist/module/index.d.ts \
            dist/module/c2.css \
            dist/web/c2.js \
            dist/web/c2.min.js \
            dist/web/c2.css
          do
            if [ ! -s "$file" ]; then
              echo "::error::missing or empty build artifact: $file"
              exit 1
            fi
            echo "ok $file ($(wc -c < "$file") bytes)"
          done

      - name: Upload artifacts
        if: matrix.node == '22'
        uses: actions/upload-artifact@v4
        with:
          name: c2js-dist
          path: dist
          retention-days: 14
